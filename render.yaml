# Render Blueprint for the RideOps API (https://render.com/docs/blueprint-spec).
# Free plan: spins down after 15 minutes idle (first request then takes ~1 minute).
# Secrets are NOT stored here: `sync: false` makes Render ask for them in the dashboard.
services:
  - type: web
    name: rideops-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: false            # deploy deliberately, after CI is green
    envVars:
      - key: RIDEOPS_ENV
        value: prod
      - key: POSTGRES_HOST
        sync: false              # e.g. ep-xxx.ap-southeast-1.aws.neon.tech
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: API_CORS_ORIGINS
        sync: false              # e.g. https://rideops.pages.dev
      - key: RETRY_RUNNER_ENABLED
        value: "false"           # public demo: no job execution from the internet
      - key: MONTHLY_BUDGET_USD
        value: "1200"
      # --- Lens (docs/ReContruction/lens-system-design.md §23, §27) ---
      - key: LENS_ENABLED
        value: "true"
      - key: LENS_ROLE
        value: all                 # one free instance runs API + worker + scheduler
      - key: DATABASE_URL
        sync: false                # Neon metadata DB (schema `app`); empty = POSTGRES_* above
      - key: LENS_MASTER_KEYS
        sync: false                # "1:<base64 32 bytes>" - generate locally, never commit
      - key: INTERNAL_TOKEN
        sync: false                # protects /internal/tick and /metrics (GitHub Actions cron uses it)
      - key: RIDEOPS_DEMO_URL
        sync: false                # read-only role on the RideOps data (never the `app` schema)
      - key: PUBLIC_APP_URL
        sync: false                # e.g. https://rideops.pages.dev
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: EMAIL_BACKEND
        value: resend              # or smtp (set SMTP_URL); console only logs the links
      - key: EMAIL_FROM
        sync: false                # e.g. "RideOps Lens <no-reply@your-domain>" (verified sender)
      - key: RESEND_API_KEY
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/lens-uploads   # free instances have no persistent disk: SQLite uploads are lost on restart
