# Local infrastructure for RideOps. Start with:  docker compose up -d
# Credentials come from .env (copy .env.example). There is no default password.
name: rideops

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: rideops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideops}
      POSTGRES_USER: ${POSTGRES_USER:-rideops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Spark + Delta Lake jobs. Not started by `docker compose up`; run on demand, e.g.
  #   docker compose run --rm spark python -m rideops.spark all
  #   docker compose run --rm spark pytest -m spark
  spark:
    profiles: ["spark"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: rideops-spark:local
    working_dir: /app
    env_file: .env
    environment:
      RIDEOPS_DATA_DIR: /app/data
      SPARK_DRIVER_MEMORY: 1g          # the host has 8 GB RAM; raise on bigger machines
      SPARK_LOCAL_IP: 127.0.0.1
      POSTGRES_HOST: postgres          # the service name inside the compose network
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app                         # live source code and data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
