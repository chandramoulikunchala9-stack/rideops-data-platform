server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers for a static single-page app.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Vite's hashed bundles never change: cache them for a year. HTML must always be fresh.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The landing page's design kit (unhashed file names): cache for an hour.
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Same-origin API: the browser talks to /api, nginx forwards to the backend container.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The dashboard's client-side routes (/app/pipelines/x, /app/costs, ...) all serve its index.html.
  location /app/ {
    add_header Cache-Control "no-cache";
    try_files $uri /app/index.html;
  }

  location = /app {
    return 301 /app/;
  }

  # The landing page and its files.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
