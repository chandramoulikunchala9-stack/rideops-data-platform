[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rideops"
version = "0.1.0"
description = "RideOps data engineering platform: synthetic data, ingestion, medallion pipelines, monitoring and cost analytics."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are pinned to exact versions so every machine (and CI) builds the same environment.
dependencies = [
    "faker==40.54.0",
    "orjson==3.13.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Spark is optional locally on Windows; it runs in the docker/spark image and in CI.
spark = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that generate full-scale datasets (deselect with -m 'not slow')",
    "postgres: tests that need a running PostgreSQL (skipped if unavailable)",
    "spark: tests that need PySpark + Delta Lake (run in the spark container or CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: common bugs, UP: modern syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; the hard limit leaves room for embedded SQL and log messages.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# PySpark column expressions read best as one chained line; the formatter still runs everywhere.
"src/rideops/spark/*" = ["E501"]
"tests/spark/*" = ["E501"]
