[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rideops-api"
version = "0.1.0"
description = "RideOps REST API: analytics, pipeline monitoring, data quality and cost reporting."
readme = "README.md"
requires-python = ">=3.10"
# Also requires the `rideops` data platform package from ../pipelines (install it first:
# pip install -e ./pipelines -e "./backend[dev]"). It is not listed here because pip does not
# support relative path dependencies in pyproject.toml.
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.15.0",
    "pydantic[email]",
    "alembic==1.20.1",
    "SQLAlchemy==2.0.58",  # 2.1 needs Python 3.11; the project supports 3.10
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "sqlglot==30.34.0",
]

[project.optional-dependencies]
# Database drivers for Lens adapters (§7.1). PostgreSQL (psycopg) and SQLite (stdlib) are built in.
mysql = ["PyMySQL==1.1.2"]
mssql = ["pymssql==2.4.6"]
mongo = ["pymongo==4.18.3"]
engines = ["PyMySQL==1.1.2", "pymssql==2.4.6", "pymongo==4.18.3"]  # newest PyMongo for Python 3.10
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "httpx==0.28.1",
]

[project.scripts]
rideops-api = "rideops_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rideops_api = ["migrations/script.py.mako", "auth/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: tests that need a running PostgreSQL (skipped if unavailable)",
]
