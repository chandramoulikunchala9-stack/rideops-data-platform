# Lakeflow Jobs (Databricks Workflows).

resources:
  jobs:
    # Daily batch: Auto Loader bronze -> silver MERGE -> quality gate -> gold.
    rideops_daily:
      name: rideops-daily-${bundle.target}
      description: Daily medallion pipeline for RideOps
      tags:
        project: rideops
        environment: ${bundle.target}
        cost_center: data-platform
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"     # 01:00 UTC every day
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1                     # never let two daily runs overlap
      timeout_seconds: 7200
      health:
        rules:
          - metric: RUN_DURATION_SECONDS          # long-running job alert
            op: GREATER_THAN
            value: 3600
      email_notifications:
        on_failure: [ "${var.alert_email}" ]
        on_duration_warning_threshold_exceeded: [ "${var.alert_email}" ]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: run_date
          default: "{{job.start_time.iso_date}}"
      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            autoscale:
              min_workers: 1
              max_workers: 3
            data_security_mode: SINGLE_USER       # Unity Catalog access mode for jobs
            # Apply policies/job_cluster_policy.json (see docs/databricks-setup.md) and add
            # policy_id: <id> here to enforce size, spot and cost-tag limits.
            aws_attributes:
              availability: SPOT_WITH_FALLBACK     # spot workers, on-demand driver
              first_on_demand: 1
            spark_conf:
              spark.sql.shuffle.partitions: auto
            custom_tags:
              project: rideops
      tasks:
        - task_key: bronze_autoloader
          job_cluster_key: etl
          notebook_task:
            notebook_path: ../notebooks/01_bronze_autoloader.py
          libraries:
            - whl: ../../pipelines/dist/*.whl
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 1800

        - task_key: silver_merge
          depends_on:
            - task_key: bronze_autoloader
          job_cluster_key: etl
          notebook_task:
            notebook_path: ../notebooks/02_silver_merge.py
          libraries:
            - whl: ../../pipelines/dist/*.whl
          max_retries: 1
          min_retry_interval_millis: 300000

        - task_key: data_quality_gate
          depends_on:
            - task_key: silver_merge
          job_cluster_key: etl
          notebook_task:
            notebook_path: ../notebooks/05_data_quality.py
          libraries:
            - whl: ../../pipelines/dist/*.whl

        - task_key: gold_aggregations
          depends_on:
            - task_key: data_quality_gate          # gold is not refreshed from bad silver data
          job_cluster_key: etl
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregations.py
          libraries:
            - whl: ../../pipelines/dist/*.whl
          max_retries: 1

    # Ride events: Auto Loader + Structured Streaming, run every 15 minutes as an incremental
    # availableNow job (cheaper than an always-on cluster for this volume).
    rideops_ride_events_stream:
      name: rideops-ride-events-${bundle.target}
      tags:
        project: rideops
        environment: ${bundle.target}
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      email_notifications:
        on_failure: [ "${var.alert_email}" ]
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: ride_events
          notebook_task:
            notebook_path: ../notebooks/04_streaming_ride_events.py
          environment_key: serverless_default    # serverless jobs compute
          max_retries: 3
          min_retry_interval_millis: 60000
      environments:
        - environment_key: serverless_default
          spec:
            client: "2"
            dependencies:
              - ../../pipelines/dist/*.whl

    # One-off backfill / reprocessing for a date range (batch processing example).
    rideops_backfill:
      name: rideops-backfill-${bundle.target}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: start_date
          default: "2026-10-01"
        - name: end_date
          default: "2026-10-31"
      tasks:
        - task_key: backfill_gold
          notebook_task:
            notebook_path: ../notebooks/06_batch_backfill.py
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            client: "2"
            dependencies:
              - ../../pipelines/dist/*.whl
