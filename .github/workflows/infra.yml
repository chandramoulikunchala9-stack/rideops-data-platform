name: Infrastructure

# Validation only: this workflow never runs `terraform plan/apply` against an AWS account and
# never deploys the Databricks bundle (both need credentials and explicit approval).
on:
  pull_request:
    paths: ["infra/**", "databricks/**", "pipelines/tests/unit/test_bundle_config.py", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "databricks/**", "pipelines/tests/unit/test_bundle_config.py", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  databricks-bundle:
    name: Databricks bundle static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3 pytest==9.2.0
      # YAML structure, file references, task DAG, paused dev schedules, notebook syntax.
      # `databricks bundle validate` additionally needs workspace credentials (see docs/ci-cd.md).
      - run: pytest pipelines/tests/unit/test_bundle_config.py -q
