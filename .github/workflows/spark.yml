name: Spark

on:
  pull_request:
    paths: ["pipelines/src/rideops/spark/**", "pipelines/src/rideops/generators/**", "pipelines/tests/spark/**", "pipelines/pyproject.toml", ".github/workflows/spark.yml"]
  push:
    branches: [main]
    paths: ["pipelines/src/rideops/spark/**", "pipelines/src/rideops/generators/**", "pipelines/tests/spark/**", "pipelines/pyproject.toml", ".github/workflows/spark.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark:
    name: PySpark + Delta Lake tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPARK_DRIVER_MEMORY: 2g
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "./pipelines[dev,spark]"
      - name: Cache Delta Lake JARs (Ivy)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('pipelines/pyproject.toml') }}
      - run: pytest pipelines/tests/spark -q
