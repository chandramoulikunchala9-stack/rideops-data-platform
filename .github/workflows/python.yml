name: Python

on:
  pull_request:
    paths: ["pipelines/**", "backend/**", "databricks/**", "monitoring/**", "scripts/**", "ruff.toml", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["pipelines/**", "backend/**", "databricks/**", "monitoring/**", "scripts/**", "ruff.toml", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: rideops
  POSTGRES_USER: rideops
  POSTGRES_PASSWORD: ci-throwaway-password  # ephemeral CI container, not a real secret

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check pipelines backend scripts
      - run: ruff format --check pipelines backend scripts

  pipelines-unit:
    name: Pipelines unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e "./pipelines[dev,aws]"
      # Generators (incl. full-scale), Databricks bundle checks, moto-based S3 and CUR tests.
      - run: pytest pipelines -m "not postgres and not spark" -q

  pipelines-integration:
    name: Pipelines + SQL integration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: rideops
          POSTGRES_USER: rideops
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rideops -d rideops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./pipelines[dev]"
      # Migrations, incremental load, SQL ELT, every named analytics query (SQL validation),
      # data-quality checks and run tracking.
      - run: pytest pipelines -m postgres -q
      - name: End-to-end CLI smoke test
        run: |
          python -m rideops.generators --scale small
          python -m rideops.db all
          python -m rideops.monitoring seed-incidents
          python -m rideops.monitoring alerts

  backend:
    name: Backend API tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: rideops
          POSTGRES_USER: rideops
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rideops -d rideops"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Lens adapter contract suite (backend/tests/lens/test_adapter_contract.py). SQL Server is not
      # run in CI (2 GB image); the suite skips any engine it can't reach.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: RootPass-123  # ephemeral CI container, not a real secret
          MYSQL_DATABASE: shop
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pRootPass-123"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: RootPass-123  # ephemeral CI container, not a real secret
        ports: ["27018:27017"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ./pipelines -e "./backend[dev,engines]"
      - run: pytest backend -q -rs
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t rideops-api:ci .
