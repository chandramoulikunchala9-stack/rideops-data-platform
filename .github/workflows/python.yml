name: Python

on:
  pull_request:
    paths: ["src/**", "tests/**", "sql/**", "databricks/**", "monitoring/**", "pyproject.toml", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "sql/**", "databricks/**", "monitoring/**", "pyproject.toml", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Includes the full-scale generator test, the Databricks bundle checks and moto-based S3 tests.
      - run: pytest -m "not postgres and not spark" -q

  backend:
    name: Backend, API and SQL tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: rideops
          POSTGRES_USER: rideops
          POSTGRES_PASSWORD: ci-throwaway-password  # ephemeral CI container, not a real secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rideops -d rideops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rideops
      POSTGRES_USER: rideops
      POSTGRES_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Migrations, incremental load, SQL ELT, every named analytics query (SQL validation),
      # data-quality checks, run tracking, and all REST API endpoints.
      - run: pytest -m postgres -q
      - name: End-to-end CLI smoke test
        run: |
          python -m rideops.generators --scale small
          python -m rideops.db all
          python -m rideops.monitoring seed-incidents
          python -m rideops.monitoring alerts
